<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Mich</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 40" aria-hidden="true">
        <path d="M4 20c10-13 30-15 44-4l10-8v24l-10-8C34 35 14 33 4 20z" fill="currentColor"/>
        <circle cx="16" cy="18" r="2.4" fill="var(--hero)"/>
      </svg>
      <h1>Fish Mich</h1>
    </div>
    <p class="sub">An AI agent for Lake Michigan salmon. It reads DNR fishing reports, NOAA buoys and the lake model, then tells you where to go.</p>
  </div>
</header>

<main>
  <section class="card ask-card">
    <label class="field-label" for="question">Your question</label>
    <textarea id="question" placeholder="e.g. I fish from the pier. Where should I go for salmon this week, and when?"></textarea>
    <div class="controls">
      <label class="control">Model <select id="model"></select></label>
      <label class="control">As of <input type="date" id="today"></label>
      <button id="ask" type="button">Ask <span class="kbd">⌘↵</span></button>
    </div>
    <div class="backtest" id="backtest" hidden></div>
  </section>

  <section>
    <h2 class="section-title">Agent steps</h2>
    <div class="card timeline" id="steps"><div class="empty">Tool calls appear here as the agent makes them.</div></div>
  </section>

  <section>
    <h2 class="section-title">Answer</h2>
    <div class="card answer-card"><div id="answer"><p class="empty">No answer yet.</p></div></div>
    <div class="totals" id="totals"></div>
  </section>
</main>
</body>
</html>
